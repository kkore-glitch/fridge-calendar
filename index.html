<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ec" />
    <meta name="description" content="管理冰箱物品與保存期限的本機優先 PWA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="冰箱日曆" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>冰箱日曆</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="回到首頁">
          <span class="brand-mark" aria-hidden="true"><img src="./icons/icon-192.png" alt="" /></span>
          <span><b>冰箱日曆</b></span>
        </a>
        <div class="top-actions">
          <button class="settings-button" id="settingsButton" type="button" aria-label="設定" title="設定">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
          </button>
          <button class="icon-button" id="transferButton" type="button" aria-label="資料轉移" title="資料轉移">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3m3 3-3 3M17 17H6l3 3m-3-3 3-3"/></svg>
          </button>
          <button class="icon-button" id="manageButton" type="button" aria-label="管理清單" title="管理清單">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
          </button>
        </div>
      </header>

      <main>
        <section class="welcome" aria-label="今日日期">
          <p class="date-label" id="todayLabel"></p>
        </section>

        <nav class="filter-tabs" aria-label="位置篩選">
          <button class="filter-tab is-active" type="button" data-filter="all">全部</button>
          <button class="filter-tab" type="button" data-filter="fridge">冷藏</button>
          <button class="filter-tab" type="button" data-filter="freezer">冷凍</button>
        </nav>

        <section id="expiryList" class="expiry-list item-carousel" aria-label="依期限排序的物品" aria-live="polite"></section>

        <section id="emptyState" class="empty-state" hidden>
          <div class="empty-illustration" aria-hidden="true">
            <svg viewBox="0 0 120 100"><path d="M35 14h50a7 7 0 0 1 7 7v65H28V21a7 7 0 0 1 7-7Z"/><path d="M28 43h64M42 27h13M42 55h13"/><circle cx="86" cy="81" r="15"/><path d="m80 81 4 4 8-10"/></svg>
          </div>
          <h2>冰箱清單還是空的</h2>
          <p>新增第一項物品，就會依保存期限自動排列。</p>
        </section>
      </main>

      <div class="bottom-action-wrap">
        <button class="primary-add-button" id="addButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          新增物品資訊
        </button>
      </div>
    </div>

    <dialog id="itemFormDialog" class="sheet-dialog">
      <form id="itemForm" method="dialog">
        <header class="dialog-header">
          <h2 id="itemFormTitle">新增物品</h2>
          <button class="icon-button close-button" value="cancel" formnovalidate aria-label="關閉">
            <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </header>
        <input id="itemId" type="hidden" />
        <fieldset class="location-fieldset">
          <legend>保存位置</legend>
          <label><input type="radio" name="location" value="fridge" checked /><span><svg viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v16H5V5a2 2 0 0 1 2-2ZM5 10h14M8 6h3M8 14h3"/></svg>冷藏</span></label>
          <label><input type="radio" name="location" value="freezer" /><span><svg viewBox="0 0 24 24"><path d="M12 2v20M4.2 6.5l15.6 11M19.8 6.5l-15.6 11M8 4l4 2 4-2M8 20l4-2 4 2M3 10l3 3-1 4M21 10l-3 3 1 4"/></svg>冷凍</span></label>
        </fieldset>
        <label class="field-label" for="itemName">品項名稱</label>
        <input class="text-input" id="itemName" name="name" maxlength="40" placeholder="例如：鮮奶" autocomplete="off" required />
        <label class="field-label" for="expiryDate">保存期限</label>
        <input class="text-input" id="expiryDate" name="expiryDate" type="date" required />
        <label class="field-label" for="itemNote">備註 <small>選填</small></label>
        <textarea class="text-input" id="itemNote" name="note" maxlength="120" rows="3" placeholder="例如：開封後請儘快食用"></textarea>
        <div class="dialog-actions">
          <button class="secondary-button" value="cancel" formnovalidate>取消</button>
          <button class="primary-button" id="saveItemButton" value="default">儲存物品</button>
        </div>
      </form>
    </dialog>

    <dialog id="detailDialog" class="sheet-dialog detail-dialog">
      <div class="dialog-header">
        <h2 id="detailName"></h2>
        <button class="icon-button close-button" data-close-dialog="detailDialog" aria-label="關閉"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <div id="detailStatus" class="detail-status"></div>
      <dl class="detail-list">
        <div><dt>保存位置</dt><dd id="detailLocation"></dd></div>
        <div><dt>保存期限</dt><dd id="detailExpiry"></dd></div>
        <div><dt>備註</dt><dd id="detailNote"></dd></div>
      </dl>
      <div class="dialog-actions">
        <button class="secondary-button danger-text" id="deleteFromDetail" type="button">刪除</button>
        <button class="primary-button" id="editFromDetail" type="button">編輯物品</button>
      </div>
    </dialog>

    <dialog id="manageDialog" class="sheet-dialog tall-dialog">
      <div class="dialog-header">
        <h2>管理物品</h2>
        <button class="icon-button close-button" data-close-dialog="manageDialog" aria-label="關閉"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <div id="manageList" class="manage-list"></div>
      <button class="primary-button full-button" id="addFromManage" type="button">新增物品</button>
    </dialog>

    <dialog id="transferDialog" class="sheet-dialog tall-dialog">
      <div class="dialog-header">
        <h2>轉移資料</h2>
        <button class="icon-button close-button" data-close-dialog="transferDialog" aria-label="關閉"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <section class="transfer-section">
        <h3>從這支手機複製</h3>
        <p>特別碼包含目前所有物品與通知條件。</p>
        <textarea class="code-area" id="exportCode" readonly aria-label="匯出特別碼"></textarea>
        <button class="primary-button full-button" id="copyCodeButton" type="button">複製特別碼</button>
      </section>
      <hr />
      <section class="transfer-section">
        <h3>貼到另一支手機</h3>
        <p>貼上特別碼後，可選擇合併或取代目前資料。</p>
        <textarea class="code-area" id="importCode" placeholder="在此貼上 FRIDGE1 開頭的特別碼" aria-label="貼上特別碼"></textarea>
        <div class="import-mode">
          <label><input type="radio" name="importMode" value="merge" checked /> 合併資料</label>
          <label><input type="radio" name="importMode" value="replace" /> 取代目前資料</label>
        </div>
        <button class="secondary-button full-button" id="importCodeButton" type="button">匯入特別碼</button>
      </section>
    </dialog>

    <dialog id="settingsDialog" class="sheet-dialog tall-dialog">
      <div class="dialog-header">
        <h2>設定</h2>
        <button class="icon-button close-button" data-close-dialog="settingsDialog" aria-label="關閉"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <fieldset class="theme-options">
        <legend>外觀</legend>
        <label><input type="radio" name="theme" value="system" /><span>自動</span></label>
        <label><input type="radio" name="theme" value="light" /><span>淺色</span></label>
        <label><input type="radio" name="theme" value="dark" /><span>深色</span></label>
      </fieldset>
      <label class="switch-row">
        <span><b>啟用通知</b><small id="permissionStatus">尚未允許通知</small></span>
        <input id="notificationsEnabled" type="checkbox" role="switch" />
      </label>
      <fieldset class="notice-options">
        <legend>提醒時間</legend>
        <label><input type="checkbox" name="noticeDays" value="7" /><span>到期前 7 天</span></label>
        <label><input type="checkbox" name="noticeDays" value="3" /><span>到期前 3 天</span></label>
        <label><input type="checkbox" name="noticeDays" value="1" /><span>到期前 1 天</span></label>
        <label><input type="checkbox" name="noticeDays" value="0" /><span>到期當天</span></label>
        <label><input type="checkbox" name="noticeDays" value="-1" /><span>物品已過期</span></label>
      </fieldset>
      <label class="field-label" for="notificationTime">每日檢查時間</label>
      <input class="text-input" id="notificationTime" type="time" value="09:00" />
      <p class="notice-help">App 開啟時一定會檢查。iPhone 請先用 Safari 開啟，點「分享」→「加入主畫面」，再從主畫面開啟 App 並允許通知。</p>
      <div class="dialog-actions stacked-mobile">
        <button class="secondary-button" id="testNotificationButton" type="button">測試通知</button>
        <button class="primary-button" id="saveSettingsButton" type="button">儲存設定</button>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
